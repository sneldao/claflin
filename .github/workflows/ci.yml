name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Desk copy and broker contracts
        run: pnpm check:canon && pnpm check:broker-voice

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_ERC8004_ENABLED: "false"
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder

  e2e:
    name: Browser acceptance
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
          NEXT_PUBLIC_ERC8004_ENABLED: "false"

      - name: Run browser acceptance
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t claflin:ci .

      - name: Serve and answer
        run: |
          docker run -d --name claflin -p 3000:3000 claflin:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then echo "Served / with 200"; break; fi
            sleep 2
          done
          docker exec claflin node -p '"Node " + process.versions.node'
          [ "$code" = "200" ] || { docker logs claflin; exit 1; }

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets in changed files
        run: |
          PATTERNS=(
            '0x[0-9a-fA-F]{64}'
            'sk_[a-zA-Z0-9]{20,}'
            'ak_[a-zA-Z0-9]{20,}'
            'tvly-[a-zA-Z0-9-]{20,}'
            'sk_live_[a-zA-Z0-9]{24,}'
            'AKIA[0-9A-Z]{16}'
            'gh[pousr]_[A-Za-z0-9_]{36,}'
          )

          FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          FOUND=0

          for file in $FILES; do
            # Skip known-safe files
            if [[ "$file" == *.example ]] || [[ "$file" == package-lock.json ]] || [[ "$file" == *.md ]]; then
              continue
            fi

            for pattern in "${PATTERNS[@]}"; do
              MATCHES=$(git show "HEAD:$file" 2>/dev/null | grep -nE "$pattern" || true)
              if [ -n "$MATCHES" ]; then
                echo "::error file=$file::Possible secret detected matching pattern: $pattern"
                FOUND=1
              fi
            done
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Secrets detected in committed files. Please remove them."
            exit 1
          fi
          echo "No secrets detected."
