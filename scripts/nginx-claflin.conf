# ================================================
# Nginx — Claflin API (Hetzner)
# ================================================
#
# Domain: api.claflin.trustfall.xyz  (backend)
# Frontend: claflin.trustfall.xyz     (Vercel)
# Upstream: 127.0.0.1:3042 (PM2; loopback-only)
#
# Install:
#   sudo cp scripts/nginx-claflin.conf /etc/nginx/sites-available/claflin
#   sudo ln -sfn /etc/nginx/sites-available/claflin /etc/nginx/sites-enabled/claflin
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS (GoDaddy → trustfall.xyz):
#   A  api.claflin  157.180.36.156
#   (Frontend separately: CNAME claflin → Vercel, or A records Vercel provides)
#
# TLS after DNS resolves (certbot amends this file with listen 443 ssl):
#   sudo certbot --nginx -d api.claflin.trustfall.xyz
#
# Production status: HTTPS is live on api.claflin.trustfall.xyz; do not
# overwrite /etc/nginx/sites-available/claflin with this template unless you
# intend to re-run certbot afterward.
# ================================================

limit_req_zone $binary_remote_addr zone=claflin_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=claflin_general:10m rate=30r/s;

upstream claflin {
    server 127.0.0.1:3042;
    keepalive 32;
}

# HTTP — ACME + (after certbot) redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.claflin.trustfall.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        limit_req zone=claflin_api burst=20 nodelay;

        proxy_pass http://claflin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=claflin_general burst=30 nodelay;

        proxy_pass http://claflin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
